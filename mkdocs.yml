site_name: PiTH
site_url: https://rick-does.github.io/pith/
site_description: A visual markdown workspace with hierarchy editing and prose 
  analysis
repo_url: https://github.com/rick-does/pith
repo_name: rick-does/pith

docs_dir: _pages
exclude_docs: README.md

theme:
  name: material
  palette:
    primary: custom
    accent: custom
  features:
  - navigation.sections
  - navigation.top
  - toc.integrate

extra_css:
- stylesheets/extra.css

nav:
- Introduction: _golden/documentation/markdowns/index.md
- Getting Started: _golden/documentation/markdowns/getting-started.md
- Managing Projects: _golden/documentation/markdowns/projects.md
- Building Your Hierarchy: _golden/documentation/markdowns/hierarchy.md
- Unlinked Files: _golden/documentation/markdowns/unlinked-files.md
- Editing Files:
  - Editing Files: _golden/documentation/markdowns/editing.md
  - Scan Example: _golden/documentation/markdowns/scan-test.md
- Frontmatter and Templates: _golden/documentation/markdowns/frontmatter.md
- Link Validation: _golden/documentation/markdowns/link-validation.md
- Search: _golden/documentation/markdowns/search.md
- Import & Export: _golden/documentation/markdowns/import-export.md
- Keyboard Shortcuts: _golden/documentation/markdowns/keyboard-shortcuts.md
