name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "_golden/documentation/**"
      - "docs/.vitepress/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - run: python scripts/gen_vitepress_sidebar.py

      - run: cp _golden/documentation/markdowns/*.md docs/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm --prefix docs install

      - run: cd docs && node_modules/.bin/vitepress build .

      # MkDocs (inactive):
      # - run: pip install mkdocs-material mkdocs-section-index
      # - run: cp _golden/documentation/markdowns/*.md _pages/
      # - run: mkdocs build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

      - uses: actions/deploy-pages@v4
        id: deployment
