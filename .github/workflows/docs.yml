name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "_golden/documentation/**"
      - "build_docs.py"
      - "_pages/**"
      - "mkdocs.yml"
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install markdown pygments "ruamel.yaml"

      - run: python build_docs.py

      - run: npx pagefind --site site

      # MkDocs build (inactive):
      # - run: pip install mkdocs-material
      # - run: cp _golden/documentation/markdowns/*.md _pages/
      # - run: mkdocs build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - uses: actions/deploy-pages@v4
        id: deployment
